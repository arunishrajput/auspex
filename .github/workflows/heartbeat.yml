name: Pipeline heartbeat

# Advances the AuspeX pipeline state machine on a schedule.
#
# This is the BACKGROUND driver, and it is a backstop rather than a clock. GitHub
# also pauses scheduled workflows on public repos after ~60 days of inactivity.
#
# ## The expression is a REQUEST. The cadence is on /audit, and it is measured.
#
# Phase 11 measured 46 hours of this workflow under the previous `*/5 * * * *`:
# ten scheduled runs, 2026-09-28T20:42Z to 2026-09-30T18:50Z, mean gap 5h07m,
# range 2h57m-6h44m, every one of them successful. That is **1.6% of the 554 runs
# the expression asked for**. GitHub throttles scheduled workflows on public
# repositories: they are delayed under load and free runners are dropped first.
#
# Two things changed as a result, and only one of them is a claim.
#
# 1. The expression now asks for twice an hour at minutes 7 and 37, not 288 times
#    a day. GitHub's own documentation names "the start of every hour" as a
#    high-load window, so the offset minutes follow its guidance rather than a
#    hunch. Asking for 48 runs and receiving 5 is a defensible request; asking for
#    554 and receiving 9 is a configuration that misdescribes the system to anyone
#    reading it.
#
# 2. **Nothing anywhere claims what this delivers.** `/audit` computes the real
#    cadence from `audit_log` on every request, so the figure a reader sees is the
#    one the log supports. The effect of the change above is UNMEASURED as of this
#    commit, and must not be quoted until it has several hours behind it.
#
# Nothing user-facing may depend on this firing on time. The dashboard's "Run tick"
# button is what advances the pipeline when someone is watching.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: # lets you trigger a tick by hand from the Actions tab

concurrency:
  group: heartbeat
  cancel-in-progress: false # never cut a tick short mid-transaction

jobs:
  tick:
    name: Advance pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: POST /api/tick
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$TICK_SECRET" ]; then
            echo "TICK_URL or TICK_SECRET not configured — skipping."
            echo "Set them with: gh secret set TICK_URL / gh secret set TICK_SECRET"
            exit 0
          fi

          # --fail-with-body so a non-2xx still prints the server's explanation.
          http_code=$(curl --silent --show-error --location \
            --max-time 120 \
            --write-out "%{http_code}" \
            --output /tmp/tick-response.json \
            --request POST "$TICK_URL" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $TICK_SECRET" \
            --data '{"source":"github-actions"}')

          echo "HTTP $http_code"
          cat /tmp/tick-response.json || true
          echo

          # A tick that takes no action is a valid outcome (fail-safe on LLM errors),
          # so only a transport/server failure is a workflow failure.
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Tick endpoint returned $http_code"
            exit 1
          fi
